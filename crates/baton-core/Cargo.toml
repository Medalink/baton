[package]
name = "baton-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aho-corasick = "1"
dirs = "6"
gix = { version = "=0.90.0", default-features = false, features = ["sha1", "parallel", "excludes", "dirwalk"] }
globset = "0.4"
regex = "1"
similar = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
